name: Daily pipeline

on:
  schedule:
    # 12:00 UTC daily
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract market data
        run: python src/extract.py

      - name: Transform with dbt
        run: dbt build --project-dir dbt_project --profiles-dir dbt_project

      - name: Commit updated warehouse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/warehouse.duckdb
          if git diff --staged --quiet; then
            echo "No changes to warehouse.duckdb"
          else
            git commit -m "chore: refresh warehouse after daily pipeline"
            git push
          fi
