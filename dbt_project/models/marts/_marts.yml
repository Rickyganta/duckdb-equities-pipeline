version: 2

models:
  - name: dim_tickers
    columns:
      - name: symbol_id
        tests: [unique, not_null]
      - name: symbol
        tests: [unique, not_null]

  - name: fct_daily_prices
    columns:
      - name: symbol_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_tickers')
              field: symbol_id
      - name: symbol
        tests: [not_null]
      - name: date
        tests: [not_null]
      - name: daily_return_percentage
        tests: [not_null]
      - name: sma_7
      - name: sma_21
      - name: rolling_volatility_30
      - name: volume_anomaly_flag
        tests: [not_null]
